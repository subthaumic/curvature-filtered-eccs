curvatures = ["gaussian_curvature", "mean_curvature"]
output_dir = "../data"
results_dir = "../results"
histogram_bins = 40
plot_percentile = 99.0

[reference]
name = "smooth_reference"
u_segments = 192
v_segments = 192

[[mesh_levels]]
name = "coarse"
u_segments = 24
v_segments = 24

[[mesh_levels]]
name = "medium"
u_segments = 48
v_segments = 48

[[mesh_levels]]
name = "fine"
u_segments = 96
v_segments = 96

[[surfaces]]
name = "doubly_elliptic_torus"
kind = "doubly_elliptic_torus"
R = 2.0
r = 0.55
a = 1.85
b = 1.05
coarse_u_segments = 12
coarse_v_segments = 12
fine_u_segments = 24
fine_v_segments = 24

[[surfaces]]
name = "ellipsoid"
kind = "ellipsoid"
a = 2.0
b = 1.5
c = 1.0
coarse_u_segments = 12
coarse_v_segments = 8
fine_u_segments = 24
fine_v_segments = 16

[[surfaces]]
name = "product_sine_graph"
kind = "product_sine_graph"
domain_size = 2.0
amplitude = 1.0
frequency = 1.0

[[surfaces]]
name = "helicoid_patch"
kind = "helicoid_patch"
rho_min = 0.0
rho_max = 1.6
theta_min = -3.141592653589793
theta_max = 3.141592653589793
alpha = 1.0
coarse_u_segments = 12
coarse_v_segments = 12
fine_u_segments = 24
fine_v_segments = 24

[[surfaces]]
name = "pseudosphere_patch"
kind = "pseudosphere_patch"
radius = 1.0
u_min = 0.15
u_max = 2.5
coarse_u_segments = 12
coarse_v_segments = 12
fine_u_segments = 24
fine_v_segments = 24
